description: >-
  Klippa's pricing is sales-led; the public site does not list per-document
  prices. Customers receive a quote based on monthly document/page volume,
  document types and product mix (DocHorizon / Financial / Identity). Free
  trials and proof-of-concept programmes are available. EU-hosted; GDPR and
  ISO 27001 compliant.
notes: >-
  Numeric prices remain unreconciled pending sales engagement; customer-
  specific contracts are negotiated annually with prepaid document buckets
  and overage rates.
sources:
- https://www.klippa.com/en/pricing/
- https://www.klippa.com/
