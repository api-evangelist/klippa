specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Klippa
providerId: klippa
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- AI
- Document AI
- IDP
- OCR
- Verification
- Rate Limiting
- Quotas
- Throttling
description: >-
  Klippa REST endpoints accept a per-API-key throttle and 429 responses on
  excess. Per-customer numeric ceilings are configured at contract sign and
  not enumerated in public docs. Document size limits and supported formats
  vary per API — DocHorizon accepts batch uploads.
notes: >-
  Customers requiring higher throughput can request a contract update or
  dedicated cluster (enterprise). Reconciled flagged false until per-product
  numeric values are visible.
sources:
- https://custom-ocr.klippa.com/
- https://www.klippa.com/
responseCodes:
  throttled: 429
limits:
- name: REST API per key
  scope: api_key
  metric: requests
  limit: see Klippa contract
  notes: Per-key throttle; 429 on excess.
- name: Per-product document caps
  scope: account
  metric: documents/month
  limit: contract-defined
  notes: Negotiated bundle per API surface.
policies:
- name: Backoff Strategy
  description: Honor 429 with Retry-After; use exponential backoff.
- name: Capacity Planning
  description: Coordinate burst windows with Klippa support; enterprise contracts can provision dedicated clusters.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
