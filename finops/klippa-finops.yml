specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Klippa
providerId: klippa
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- AI
- Document AI
- IDP
- OCR
- Verification
- FinOps
- Cost Management
- FOCUS
description: >-
  FOCUS-aligned FinOps profile for Klippa. Billing is annual sales-led
  contracts denominated in monthly document/page buckets per API surface
  (DocHorizon, Financial OCR, Identity Verification). Charges typically
  bill in EUR for EU customers / USD for US customers; can include EU
  data-residency and on-prem clauses.
notes: >-
  Klippa's strength as a FinOps subject is per-API-surface allocation —
  invoices, receipts and identity verifications can be tracked separately
  through different API keys.
sources:
- https://www.klippa.com/en/pricing/
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Klippa
serviceCategory: Document AI
billingModel:
  pricingCategory: Subscription + Usage (per document)
  billingFrequency: Annual
  billingCurrency: EUR / USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Klippa DocHorizon
  ServiceCategory: AI / IDP
  ProviderName: Klippa
  PublisherName: Klippa
  InvoiceIssuerName: Klippa
  BillingCurrency: EUR
  ChargeCategory: Usage
  PricingUnit: document / verification
meters:
- name: documents_processed_dochorizon
  description: Documents processed via DocHorizon platform.
  unit: document
  aggregation: sum
  dimensions:
  - account
  - api_key
  - document_type
- name: financial_documents
  description: Receipts / invoices / bank statements parsed.
  unit: document
  aggregation: sum
  dimensions:
  - account
- name: identity_verifications
  description: Identity verifications (KIV) performed.
  unit: verification
  aggregation: sum
  dimensions:
  - account
- name: subscription_contract
  description: Annual contract subscription.
  unit: contract-year
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Use Klippa portal usage page; group by API key for per-product breakdown.
- name: Allocation
  description: One API key per business unit / product line; map to FOCUS ResourceTag.
- name: Optimization
  description: Right-size annual document buckets; renegotiate at renewal; combine receipts/invoices into DocHorizon if volume warrants consolidated platform pricing.
- name: Accountability
  description: Assign API-key owners; review monthly burn-down.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
